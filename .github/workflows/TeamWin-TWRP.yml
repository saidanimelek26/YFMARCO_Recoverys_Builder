name: TeamWin [TWRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-4.4-deprecated'
        type: choice
        options:
        - twrp-14.1
        - twrp-12.1
        - twrp-11
        - twrp-10.0-deprecated
        - twrp-9.0
        - twrp-8.1
        - twrp-7.1
        - twrp-6.0
        - twrp-5.1
        - twrp-4.4-deprecated

      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: false
        type: boolean

      LDCHECKPATH:
        description: 'Path of blobs to check'
        required: true
        default: 'system/bin/qseecomd'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04

    if: github.event.repository.owner.id == github.event.sender.id

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:

    # ---------------------------------------------------------
    # Checkout builder repository
    # ---------------------------------------------------------
    - name: Check Out
      uses: actions/checkout@v4

    # ---------------------------------------------------------
    # Display inputs
    # ---------------------------------------------------------
    - name: Display Inputs
      run: |
        echo "Displaying variables/inputs."
        echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: https://github.com/saidanimelek26/PAD_D85"
        echo "Device Tree Branch: main"
        echo "Build Target: ${{ inputs.BUILD_TARGET }}"

    # ---------------------------------------------------------
    # Cleanup
    # ---------------------------------------------------------
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    # ---------------------------------------------------------
    # Set Swap
    # ---------------------------------------------------------
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 20

    # ---------------------------------------------------------
    # Select TWRP manifest
    # ---------------------------------------------------------
    - name: Check Manifest Branch
      run: |
        if [ "${{ inputs.MANIFEST_BRANCH }}" = "twrp-11" ] || \
           [ "${{ inputs.MANIFEST_BRANCH }}" = "twrp-12.1" ] || \
           [ "${{ inputs.MANIFEST_BRANCH }}" = "twrp-14.1" ]; then

            echo "MANIFEST=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git" >> $GITHUB_ENV
            echo "CHECK_LEGACY_BRANCH=false" >> $GITHUB_ENV

        else

            echo "MANIFEST=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git" >> $GITHUB_ENV
            echo "CHECK_LEGACY_BRANCH=true" >> $GITHUB_ENV

        fi

    # ---------------------------------------------------------
    # Prepare build environment
    # ---------------------------------------------------------
    - name: Prepare the environment
      run: |
        sudo apt update

        sudo apt -y upgrade

        sudo apt -y install \
          gperf \
          gcc-multilib \
          gcc-10-multilib \
          g++-multilib \
          g++-10-multilib \
          libc6-dev \
          lib32ncurses5-dev \
          x11proto-core-dev \
          libx11-dev \
          tree \
          lib32z-dev \
          libgl1-mesa-dev \
          libxml2-utils \
          xsltproc \
          bc \
          ccache \
          lib32readline-dev \
          lib32z1-dev \
          liblz4-tool \
          libncurses5-dev \
          libsdl1.2-dev \
          libwxgtk3.0-gtk3-dev \
          libxml2 \
          lzop \
          pngcrush \
          schedtool \
          squashfs-tools \
          imagemagick \
          libbz2-dev \
          lzma \
          ncftp \
          qemu-user-static \
          libstdc++-10-dev \
          libtinfo5 \
          libgflags-dev \
          libncurses5 \
          python3 \
          curl \
          repo \
          git

    # ---------------------------------------------------------
    # Java
    # ---------------------------------------------------------
    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    # ---------------------------------------------------------
    # Install Repo
    # ---------------------------------------------------------
    - name: Install Git-Repo
      run: |
        mkdir -p ~/bin

        curl -L \
          https://storage.googleapis.com/git-repo-downloads/repo \
          -o ~/bin/repo

        chmod a+x ~/bin/repo

        sudo ln -sf ~/bin/repo /usr/bin/repo

        repo --version

    # ---------------------------------------------------------
    # Initialize Android/TWRP source
    # ---------------------------------------------------------
    - name: Initialize Repo
      run: |
        mkdir -p android-recovery

        cd android-recovery

        git config --global user.name "${{ github.actor }}"

        git config --global user.email \
          "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

        repo init \
          --depth=1 \
          -u "${{ env.MANIFEST }}" \
          -b "${{ inputs.MANIFEST_BRANCH }}"

    # ---------------------------------------------------------
    # Add PAD_D85 device tree to repo local manifest
    # This is the FIX for roomservice error
    # ---------------------------------------------------------
    - name: Add PAD_D85 to Local Manifest
      run: |
        cd android-recovery

        mkdir -p .repo/local_manifests

        cat > .repo/local_manifests/PAD_D85.xml <<'XMLEOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <remote name="github" fetch="https://github.com/" />
          <project name="saidanimelek26/PAD_D85"
                   path="device/alps/PAD_D85"
                   remote="github"
                   revision="main" />
        </manifest>
        XMLEOF

        echo "======================================"
        echo "Local manifest created:"
        echo "======================================"
        cat .repo/local_manifests/PAD_D85.xml

    # ---------------------------------------------------------
    # Sync TWRP source + device tree
    # ---------------------------------------------------------
    - name: Repo Sync
      run: |
        cd android-recovery

        repo sync \
          -j$(nproc --all) \
          --force-sync

    # ---------------------------------------------------------
    # Guava dependency for TWRP 14.1
    # ---------------------------------------------------------
    - name: Ensure Guava dependency exists
      if: inputs.MANIFEST_BRANCH == 'twrp-14.1'
      run: |
        cd android-recovery

        if [ -f external/guava/Android.bp ] && \
           grep -q 'name:[[:space:]]*"guava"' external/guava/Android.bp; then

          echo "Guava module is already available."

        else

          echo "Guava module missing after sync."
          echo "Cloning fallback project..."

          rm -rf external/guava

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/external/guava \
            external/guava

        fi

    # ---------------------------------------------------------
    # Verify Device Tree
    # ---------------------------------------------------------
    - name: Verify Device Tree
      run: |
        cd android-recovery

        echo "======================================"
        echo "PAD_D85 Device Tree"
        echo "======================================"

        ls -la device/alps/PAD_D85

        echo ""
        echo "Device Tree structure:"
        tree -L 2 device/alps/PAD_D85 || true

        echo ""
        echo "Device Tree Commit:"
        cd device/alps/PAD_D85
        git rev-parse HEAD
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    # ---------------------------------------------------------
    # Legacy Python 2
    # ---------------------------------------------------------
    - name: Installing python2 for legacy builds
      if: env.CHECK_LEGACY_BRANCH == 'true'
      run: |
        sudo add-apt-repository ppa:deadsnakes/ppa -y

        sudo apt-get update

        sudo apt-get install -y python2.7

        sudo ln -sf /usr/bin/python2.7 /usr/bin/python

        sudo ln -sf /usr/bin/python2.7 /usr/bin/python2

    # ---------------------------------------------------------
    # Detect device configuration
    # ---------------------------------------------------------
    - name: Detect Device Configuration
      run: |
        cd android-recovery/device/alps/PAD_D85

        echo "======================================"
        echo "Searching device configuration"
        echo "======================================"

        find . -maxdepth 2 -type f \
          \( -name "*.mk" -o -name "AndroidProducts.mk" -o -name "Android.bp" \) \
          -print

        echo ""

        PRODUCT_NAME=$(grep -Rhs \
          "^[[:space:]]*PRODUCT_NAME[[:space:]]*:=" \
          . \
          --include="*.mk" \
          | head -n 1 \
          | sed 's/.*:= *//')

        PRODUCT_DEVICE=$(grep -Rhs \
          "^[[:space:]]*PRODUCT_DEVICE[[:space:]]*:=" \
          . \
          --include="*.mk" \
          | head -n 1 \
          | sed 's/.*:= *//')

        PRODUCT_BRAND=$(grep -Rhs \
          "^[[:space:]]*PRODUCT_BRAND[[:space:]]*:=" \
          . \
          --include="*.mk" \
          | head -n 1 \
          | sed 's/.*:= *//')

        echo "PRODUCT_NAME:   $PRODUCT_NAME"
        echo "PRODUCT_DEVICE: $PRODUCT_DEVICE"
        echo "PRODUCT_BRAND:  $PRODUCT_BRAND"

        if [ -z "$PRODUCT_NAME" ]; then
          echo "ERROR: PRODUCT_NAME was not found."
          exit 1
        fi

        if [ -z "$PRODUCT_DEVICE" ]; then
          echo "ERROR: PRODUCT_DEVICE was not found."
          exit 1
        fi

        echo "DEVICE_MAKEFILE=$PRODUCT_NAME" >> $GITHUB_ENV
        echo "DEVICE_NAME=$PRODUCT_DEVICE" >> $GITHUB_ENV
        echo "DEVICE_BRAND=$PRODUCT_BRAND" >> $GITHUB_ENV

    # ---------------------------------------------------------
    # Show build variables
    # ---------------------------------------------------------
    - name: Display Device Variables
      run: |
        echo "======================================"
        echo "Build Variables"
        echo "======================================"

        echo "DEVICE_MAKEFILE=${{ env.DEVICE_MAKEFILE }}"
        echo "DEVICE_NAME=${{ env.DEVICE_NAME }}"
        echo "DEVICE_BRAND=${{ env.DEVICE_BRAND }}"
        echo "BUILD_TARGET=${{ inputs.BUILD_TARGET }}"
        echo "MANIFEST_BRANCH=${{ inputs.MANIFEST_BRANCH }}"
        echo "COMMIT_ID=${{ env.COMMIT_ID }}"

    # ---------------------------------------------------------
    # Build TWRP
    # ---------------------------------------------------------
    - name: Building Image
      run: |
        cd android-recovery

        source build/envsetup.sh

        export ALLOW_MISSING_DEPENDENCIES=true

        echo "======================================"
        echo "Starting TWRP build"
        echo "======================================"

        if [ "${{ inputs.MANIFEST_BRANCH }}" = "twrp-14.1" ]; then

          lunch "${{ env.DEVICE_MAKEFILE }}-ap2a-eng"

          make clean

          make \
            "${{ inputs.BUILD_TARGET }}image" \
            -j$(nproc --all)

        else

          lunch "${{ env.DEVICE_MAKEFILE }}-eng"

          make clean

          make \
            "${{ inputs.BUILD_TARGET }}image" \
            -j$(nproc --all)

        fi

        echo ""
        echo "======================================"
        echo "Build completed"
        echo "======================================"

        echo "Done building your ${{ inputs.BUILD_TARGET }}.img"

    # ---------------------------------------------------------
    # Set build target name
    # ---------------------------------------------------------
    - name: Set build target for upload
      run: |
        if [ "${{ inputs.BUILD_TARGET }}" = "recovery" ]; then

          echo "BUILD_TARGET_NAME=recovery" >> $GITHUB_ENV

        elif [ "${{ inputs.BUILD_TARGET }}" = "boot" ]; then

          echo "BUILD_TARGET_NAME=boot" >> $GITHUB_ENV

        else

          echo "BUILD_TARGET_NAME=vendor_boot" >> $GITHUB_ENV

        fi

    # ---------------------------------------------------------
    # Build date
    # ---------------------------------------------------------
    - name: Set Build Date
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

    # ---------------------------------------------------------
    # Show output files
    # ---------------------------------------------------------
    - name: List Build Output
      run: |
        echo "======================================"
        echo "Build Output"
        echo "======================================"

        ls -lah \
          android-recovery/out/target/product/${{ env.DEVICE_NAME }}/ \
          || true

    # ---------------------------------------------------------
    # Upload Release
    # ---------------------------------------------------------
    - name: Upload to Release
      uses: softprops/action-gh-release@v2.3.0

      with:
        files: |
          android-recovery/out/target/product/${{ env.DEVICE_NAME }}/${{ env.BUILD_TARGET_NAME }}.img
          android-recovery/out/target/product/${{ env.DEVICE_NAME }}/*installer*zip
          android-recovery/out/target/product/${{ env.DEVICE_NAME }}/ramdisk-recovery.*

        name: Unofficial TWRP for ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}

        tag_name: ${{ github.run_id }}

        token: ${{ secrets.RECOVERY_TOKEN }}

        body: |
          Build: ${{ inputs.MANIFEST_BRANCH }}
          Device Tree: https://github.com/saidanimelek26/PAD_D85
          Commit: ${{ env.COMMIT_ID }}

    # ---------------------------------------------------------
    # LDCheck
    # ---------------------------------------------------------
    - name: Run LDCheck
      if: inputs.LDCHECK == true
      run: |
        cd tools

        mv -n \
          libneeds \
          ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ env.DEVICE_NAME }}/recovery/root/

        mv -n \
          ldcheck \
          ${GITHUB_WORKSPACE}/android-recovery/out/target/product/${{ env.DEVICE_NAME }}/recovery/root/

        cd ../android-recovery/out/target/product/${{ env.DEVICE_NAME }}/recovery/root

        python3 ldcheck \
          -p system/lib64:vendor/lib64:system/lib:vendor/lib \
          -d "${{ inputs.LDCHECKPATH }}"

        echo "Done checking missing dependencies."
        echo "Review, and reconfigure your tree."

      continue-on-error: true
